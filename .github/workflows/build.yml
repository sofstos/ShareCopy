name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

      - name: Publish result (APK and/or build log) to apk-output branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp /tmp/build.log /tmp/build.log.saved
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk.saved
          fi
          git checkout --orphan apk-output
          # Полностью чистим рабочую директорию (build/, .gradle/, исходники и т.п.),
          # чтобы в служебной ветке остались только нужные файлы результата.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp /tmp/build.log.saved ./build.log
          if [ -f /tmp/app-debug.apk.saved ]; then
            cp /tmp/app-debug.apk.saved ./app-debug.apk
          fi
          git add -A
          git commit -m "Build run ${{ github.run_number }} (${{ github.sha }}) - outcome: ${{ steps.build.outcome }}"
          git push -f origin apk-output

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
