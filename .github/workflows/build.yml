name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK non-interactively
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_HOME is not set}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          # sdkmanager завершает чтение после последней лицензии, поэтому yes
          # получает ожидаемый Broken pipe; это не должно ломать шаг при pipefail.
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache librclone.aar
        id: cache-librclone
        uses: actions/cache@v4
        with:
          path: app/libs/librclone.aar
          key: librclone-aar-v2-arm64only-stripped

      - name: Build librclone.aar (Go + gomobile + NDK) — diagnostic stage, не ломает основную сборку
        if: steps.cache-librclone.outputs.cache-hit != 'true'
        id: librclone
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "=== Installing Android NDK ==="
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_HOME is not set}}"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$(command -v sdkmanager)"
            fi
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;26.1.10909125"
            export ANDROID_NDK_HOME="$SDK_ROOT/ndk/26.1.10909125"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

            echo "=== Installing gomobile/gobind ==="
            go install golang.org/x/mobile/cmd/gomobile@latest
            go install golang.org/x/mobile/cmd/gobind@latest
            export PATH="$PATH:$(go env GOPATH)/bin"
            gomobile init

            echo "=== Fetching rclone module ==="
            mkdir -p /tmp/rclone-build && cd /tmp/rclone-build
            go mod init tmprclonebuild
            go get github.com/rclone/rclone@latest
            go get -tool golang.org/x/mobile/cmd/gobind
            go get -tool golang.org/x/mobile/cmd/gomobile

            echo "=== Building librclone.aar (только arm64 — современные устройства все на нём; -s -w чистят отладочную информацию) ==="
            mkdir -p "$GITHUB_WORKSPACE/app/libs"
            gomobile bind -v -target=android/arm64 -androidapi 30 \
              -ldflags="-s -w" \
              -javapkg=org.rclone \
              -o "$GITHUB_WORKSPACE/app/libs/librclone.aar" \
              github.com/rclone/rclone/librclone/gomobile
          } 2>&1 | tee /tmp/librclone_build.log

      - name: Dump librclone.aar Java/Kotlin API (диагностика для следующего шага интеграции)
        if: always()
        run: |
          set -o pipefail
          {
            echo "=== librclone.aar exists? ==="
            ls -la app/libs/librclone.aar 2>&1 || echo "NOT FOUND"
            if [ -f app/libs/librclone.aar ]; then
              echo "=== Archive contents ==="
              unzip -l app/libs/librclone.aar || true
              echo "=== Extracting classes.jar and dumping public API ==="
              rm -rf /tmp/aar_extract && mkdir -p /tmp/aar_extract
              unzip -o app/libs/librclone.aar -d /tmp/aar_extract > /dev/null
              CLASSES_JAR=$(find /tmp/aar_extract -name "classes.jar" | head -1)
              echo "classes.jar path: $CLASSES_JAR"
              if [ -n "$CLASSES_JAR" ]; then
                echo "=== All class names containing 'rclone' or 'Gomobile' ==="
                unzip -l "$CLASSES_JAR" | grep -i -E "rclone|gomobile" || true
                echo "=== javap dump of likely main class ==="
                for CLS in org.rclone.gomobile.Gomobile org.rclone.Gomobile; do
                  echo "--- trying $CLS ---"
                  javap -p -classpath "$CLASSES_JAR" "$CLS" 2>&1 || true
                done
              fi
            fi
          } 2>&1 | tee -a /tmp/librclone_build.log

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          { cat /tmp/librclone_build.log 2>/dev/null; echo "=== GRADLE BUILD ==="; gradle assembleDebug --no-daemon; } 2>&1 | tee /tmp/build.log

      - name: Extract version name
        if: steps.build.outcome == 'success'
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish APK as GitHub Release asset
        if: steps.build.outcome == 'success'
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            # APK теперь заметно больше 100 МБ (rclone) — обычный git push такой файл не пропустит.
            # Release assets отдаются через release-assets.githubusercontent.com, а не через
            # тот же Azure Blob, что блокировал обычные Actions-артефакты и логи джобов.
            VERSION="${{ steps.version.outputs.name }}"
            RELEASE_TAG="v${VERSION}-build-${{ github.run_number }}"
            APK_NAME="ShareCopy-v${VERSION}.apk"
            cp "app/build/outputs/apk/debug/app-debug.apk" "app/build/outputs/apk/debug/$APK_NAME"
            gh release create "$RELEASE_TAG" "app/build/outputs/apk/debug/$APK_NAME" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "ShareCopy v${VERSION} (сборка ${{ github.run_number }})" \
              --notes "Версия ${VERSION}. Автоматическая сборка из коммита ${{ github.sha }}. Старые релизы не изменяются."
          } 2>&1 | tee /tmp/release.log

      - name: Publish build log to apk-output branch
        if: always()
        run: |
          cp /tmp/build.log /tmp/build.log.saved 2>/dev/null || echo "no build.log" > /tmp/build.log.saved
          cp /tmp/release.log /tmp/release.log.saved 2>/dev/null || echo "no release.log (step didn't run)" > /tmp/release.log.saved
          # ВАЖНО: делаем это в отдельной изолированной директории, а не в $GITHUB_WORKSPACE —
          # иначе git checkout --orphan/rm -rf стирает app/libs/librclone.aar ДО того, как
          # actions/cache успевает сохранить его в конце job'а (именно это и происходило).
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cd /tmp/pub
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git checkout --orphan apk-output
          cp /tmp/build.log.saved ./build.log
          cp /tmp/release.log.saved ./release.log
          git add -A
          git commit -m "Build log run ${{ github.run_number }} (${{ github.sha }}) - build: ${{ steps.build.outcome }}, release: ${{ steps.release.outcome }}"
          git push -f origin apk-output

      - name: Fail job if build or release failed
        if: steps.build.outcome == 'failure' || steps.release.outcome == 'failure'
        run: exit 1
