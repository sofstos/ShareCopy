name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShareCopy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to apk-output branch
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-output
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/app-debug.apk .
          git add app-debug.apk
          git commit -m "APK build run ${{ github.run_number }} (${{ github.sha }})"
          git push -f origin apk-output
